map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hinter NPM kommt https als X-Forwarded-Proto an, beim direkten LAN-Zugriff fehlt der Kopf.
map $http_x_forwarded_proto $weiter_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Weiterleitungen relativ: hinter NPM (https) darf nginx kein http://-Ziel bauen.
    absolute_redirect off;

    # Der FAH-Extraktor belegt nur "/", "/favicon.svg" und "/_explorer/...". Alle übrigen
    # Pfade gehören der virtuellen Vorschau des angemeldeten Kontos und gehen über das
    # Backend an den Wegwerf-Container (UniFi: /manage, /api, /v2, /wss – MikroTik/WebFig:
    # /webfig, /jsproxy, /rest). Die Vorschau läuft als iframe IN der Explorer-Seite
    # (gleiche Origin): sicherheit.inc (frame-ancestors 'none') hängt deshalb nur an den
    # statischen Explorer-Seiten, nie an /_explorer/api/ (iframe-Quelle
    # /_explorer/api/vorschau/oeffnen) oder am Catch-all; Rahmen-Köpfe des Gastes
    # (X-Frame-Options, frame-ancestors) ersetzt der Backend-Proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://unifi-backup-explorer-api:3000;
    # Backup-Upload für die Vorschau (UniFi-ZIP, MikroTik .backup/.rsc) bis 300 MB –
    # gleicher Deckel wie MAX_UPLOAD im Backend; gilt für alle Locations.
    client_max_body_size 300m;

    # Anmeldung: Die Explorer-Seite gibt es nur mit gültiger Sitzung. Das Backend
    # prüft das Cookie (204 = angemeldet, 401 = zur Anmeldeseite). API und Vorschau
    # prüft das Backend selbst.
    location = /_explorer/pruefen {
        internal;
        proxy_pass $api/_explorer/api/pruefen;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location @anmelden {
        return 302 /_explorer/anmeldung;
    }

    location = / {
        # Aus einem Frame (Vorschau-Fenster) gehört "/" der Vorschau: WebFig 7.2x hat dort seine
        # Anmeldung. Die App selbst wird nie eingebettet (frame-ancestors 'none').
        if ($http_sec_fetch_dest = "iframe") { rewrite ^ /_explorer/vorschau-wurzel last; }
        auth_request /_explorer/pruefen;
        error_page 401 = @anmelden;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, private";
        include /etc/nginx/conf.d/sicherheit.inc;
    }

    location = /index.html {
        auth_request /_explorer/pruefen;
        error_page 401 = @anmelden;
        add_header Cache-Control "no-cache, private";
        include /etc/nginx/conf.d/sicherheit.inc;
    }

    location = /_explorer/anmeldung {
        try_files /anmeldung.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/sicherheit.inc;
    }

    location = /favicon.svg {
        expires 7d;
        include /etc/nginx/conf.d/sicherheit.inc;
    }

    location /_explorer/assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/sicherheit.inc;
        try_files $uri =404;
    }

    # Mitschau-WebSocket (Co-Browsing): je angemeldeter Oberfläche ein Kanal zum Backend.
    # Die Anmeldung prüft das Backend beim Upgrade selbst (Sitzungs-Cookie).
    location = /_explorer/ws/mitschau {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $weiter_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API (Konten, Einstellungen, Vorschau-Status/-Start, MikroTik-Versionen). Bewusst ohne
    # sicherheit.inc: vorschau/oeffnen ist die iframe-Quelle des Vorschau-Fensters.
    location /_explorer/api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $weiter_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # "/" der Vorschau (siehe location = /): unverändert als "/" ans Backend.
    location = /_explorer/vorschau-wurzel {
        internal;
        proxy_pass $api/$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $weiter_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Catch-all = Vorschau-Proxy (UniFi-Oberfläche mit WebSockets, WebFig mit /jsproxy-
    # Polling). Ohne sicherheit.inc und ohne Buffering; das Backend wählt den Lauf des
    # Kontos und setzt frame-ancestors 'self', damit die Oberfläche im Fenster läuft.
    location / {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $weiter_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
